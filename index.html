<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15191e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lot Locator">
<title>Lot Locator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2b705'/%3E%3Ctext x='32' y='46' font-family='Arial' font-weight='700' font-size='40' text-anchor='middle' fill='%231d1700'%3EP%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column; a sticky search bar, garage-level "signs" as filters, then car rows. A bottom sheet handles parking + editing. */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#15191e; --muted:#5a636e; --line:#d3d8de;
  --accent:#f2b705; --accent-ink:#1d1700; --danger:#c2362b; --ok:#1f7a4a; --warn:#a86400;
  --scrim:rgba(10,14,20,.5);
  --lv-LOT:#2f7d4f; --lv-UL:#8a6d1d; --lv-SD:#11787a; --lv-B1:#2d5fb8; --lv-R1:#c4581a; --lv-R2:#7a4bb3; --lv-SHW:#b3324a; --lv-DET:#2c84a8; --lv-OUT:#5d6670;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1a1e23; --surface-2:#20252b; --ink:#e7eaee; --muted:#9aa4af; --line:#2d333a;
  --accent:#f5c518; --accent-ink:#1d1700; --danger:#ef6b5f; --ok:#4cc184; --warn:#e6a23c; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1e23; --surface-2:#20252b; --ink:#e7eaee; --muted:#9aa4af; --line:#2d333a;
  --accent:#f5c518; --accent-ink:#1d1700; --danger:#ef6b5f; --ok:#4cc184; --warn:#e6a23c; --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.brandrow{display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none}
.brand{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);margin-top:3px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.me img{width:26px;height:26px;border-radius:50%}
.me span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:14ch}
.searchrow{display:flex;gap:8px}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:0 14px 0 40px;font-size:16px}
.search input:focus{border-color:var(--accent);outline:none}
.search svg{position:absolute;left:12px;top:13px;width:20px;height:20px;stroke:var(--muted)}
.btn{height:46px;padding:0 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* level signs */
main .wrap{display:flex;flex-direction:column;gap:16px;padding-block:16px 48px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.levels{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lvl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.lvl[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lvl .t{min-width:0;display:flex;flex-direction:column}
.lvl .t b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl .t span{font-size:12px;color:var(--muted)}
.sign{flex:none;min-width:38px;height:30px;padding:0 6px;border-radius:6px;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.03em;display:grid;place-items:center;line-height:1}

.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters select{height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);padding:0 10px;font-size:13px}
#brand{margin-left:auto}

.notice{padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px dashed var(--line);color:var(--muted);font-size:13px}
.notice.warn{border-style:solid;border-color:var(--warn);color:var(--ink)}

/* car rows */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.car{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;width:100%;text-align:left}
.car:hover{border-color:var(--muted)}
.car .id{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.car .stock{font-family:var(--f-mono);font-weight:700;font-size:15px}
.car .name{font-weight:600;min-width:0}
.car .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.car .loc{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:0}
.car .spot{font-weight:600;font-size:13px;text-align:right;max-width:20ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.stale{color:var(--warn);font-weight:600}
.empty{padding:28px 18px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{margin:0;font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.02em}
.empty p{margin:0;color:var(--muted);max-width:46ch}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet h2{margin:0;font-family:var(--f-display);font-size:28px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:13px;display:flex;gap:6px 12px;flex-wrap:wrap}
.sheethead{display:flex;gap:12px;align-items:flex-start}
.sheethead > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:20px;line-height:1;flex:none}
.now{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line)}
.now .sign{height:40px;min-width:50px;font-size:22px}
.now div{min-width:0}
.now b{display:block}
.now span{font-size:12.5px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{height:46px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface-2);padding:0 12px;font-size:16px;width:100%}
.field textarea{height:72px;padding:10px 12px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:460px){.picker{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pick{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:52px;text-align:left;font-size:13px;font-weight:600}
.pick[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink);background:var(--surface-2)}
.pick .sign{min-width:34px;height:28px;font-size:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn.primary{flex:1;min-width:160px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.hist li .sign{grid-row:span 2;min-width:34px;height:26px;font-size:15px}
.hist li span{color:var(--muted);font-size:12px}
.err{color:var(--danger);font-size:13px;font-weight:600}
.confirm{padding:12px;border:1.5px solid var(--danger);border-radius:var(--r);display:flex;flex-direction:column;gap:10px}
.inrow{display:flex;gap:8px}
.inrow input{flex:1;min-width:0}
.btn svg{width:20px;height:20px;flex:none}
.btn.scan{width:46px;padding:0;flex:none}
.hint{font-size:12.5px;color:var(--muted)}
.found{font-family:var(--f-mono);font-weight:700;font-size:18px;padding:10px 12px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);word-break:break-all}
@media (max-width:440px){.scan-txt{display:none}#scanBtn{width:46px;padding:0}}
.tools{display:flex;justify-content:flex-end;margin-top:-8px}
.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:460px){.mapgrid{grid-template-columns:1fr}}
.mapgrid select{height:40px;font-size:14px}
.preview{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:4px}
.preview li{padding:6px 10px;background:var(--surface-2);border-radius:6px;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{width:20px;height:20px;flex:none;margin-top:1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.authcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.authcard h2{margin:0;font-family:var(--f-display);font-size:28px;text-transform:uppercase}
.authform{display:flex;flex-direction:column;gap:12px}
.authform .btn{width:100%}
.authcard .actions{justify-content:space-between}
.tools{gap:4px;flex-wrap:wrap}
.car.withthumb{grid-template-columns:64px minmax(0,1fr) auto}
.car.withthumb .meta{grid-column:2/-1}
.thumb{grid-row:span 2;width:64px;height:48px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb svg{width:22px;height:22px}
.photo{display:flex;flex-direction:column;gap:8px}
.photo img{width:100%;max-height:300px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2)}
.photo .btn{align-self:flex-start}
.thumb.stock{position:relative}
.thumb.stock img{opacity:.85}
.thumb.stock::after{content:"STOCK";position:absolute;left:2px;bottom:2px;font-size:8px;font-weight:700;letter-spacing:.06em;padding:1px 3px;border-radius:3px;background:rgba(0,0,0,.65);color:#fff}
.stockwrap{position:relative}
.stockwrap img{width:100%;max-height:300px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);display:block}
.stocktag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(0,0,0,.7);color:#fff}
.btn.addphoto{height:64px;border-style:dashed;color:var(--muted);width:100%}
.scanner{position:fixed;inset:0;z-index:40;background:#000;color:#fff}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-frame{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.sc-box{position:relative;width:min(90vw,560px);aspect-ratio:5/2;border:3px solid var(--accent);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.sc-line{position:absolute;left:4%;right:4%;top:50%;height:2px;background:var(--accent);opacity:.85}
.sc-top{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px))}
.sc-bottom{position:absolute;left:0;right:0;bottom:0;padding:24px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.sc-hint{font-weight:600;font-size:16px;text-align:center;text-shadow:0 1px 3px #000;max-width:40ch}
.scanner .btn,.scanner .x{background:rgba(255,255,255,.94);color:#111;border-color:transparent}
@media (max-width:440px){.car.withthumb{grid-template-columns:52px minmax(0,1fr) auto}.thumb{width:52px;height:40px}}
</style>
</head>
<body>
<section id="auth" class="authwrap" hidden><div class="authcard" id="authCard"></div></section>

<div id="app" hidden>
<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <div class="mark" aria-hidden="true">P</div>
      <div class="brand">Lot Locator<small>Where every car on the property was last parked</small></div>
      <div class="me" id="me"></div>
    </div>
    <div class="searchrow">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Stock #, last 6 of VIN, model, color…" autocomplete="off" aria-label="Search cars">
      </label>
      <button class="btn" id="scanBtn" type="button" aria-label="Scan a VIN or stock barcode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg><span class="scan-txt">Scan</span></button>
      <button class="btn primary" id="addBtn" type="button">+ Add car</button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <section style="display:flex;flex-direction:column;gap:8px">
      <div class="label">Levels &amp; areas · tap to filter</div>
      <div class="levels" id="levels"></div>
    </section>
    <div class="filters" id="filters">
      <button class="chip" data-type="" aria-pressed="true" type="button">All</button>
      <button class="chip" data-type="New" aria-pressed="false" type="button">New</button>
      <button class="chip" data-type="Used" aria-pressed="false" type="button">Used</button>
      <button class="chip" data-type="Service" aria-pressed="false" type="button">Service</button>
      <button class="chip" data-type="Loaner" aria-pressed="false" type="button">Loaner</button>
      <select id="brand" aria-label="Brand" hidden></select>
      <select id="sort" aria-label="Sort">
        <option value="recent">Recently moved</option>
        <option value="stock">Stock #</option>
        <option value="stale">Longest untouched</option>
      </select>
    </div>
    <div class="tools" id="tools" hidden>
      <button class="btn ghost" id="teamBtn" type="button">Team &amp; approvals</button>
      <button class="btn ghost" id="importBtn" type="button">⇪ Import inventory file</button>
    </div>
    <div id="status" class="notice" hidden></div>
    <ul class="list" id="list"></ul>
  </div>
</main>
</div>

<div id="sheetRoot" hidden></div>
<div id="toast" class="toast" hidden></div>
<input id="cam" type="file" accept="image/*" capture="environment" hidden>
<input id="photoFile" type="file" accept="image/*" capture="environment" hidden>
<input id="importFile" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="stock/stock.js"></script>
<script src="app.js"></script>
</body>
</html>
